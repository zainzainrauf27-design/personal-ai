<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal AI</title>

    <meta
        name="description"
        content="Personal AI Cyber Command Center"
    >

    <meta
        name="theme-color"
        content="#05070a"
    >
</head>

<body>

    <main id="app">

        <h1>PERSONAL AI</h1>

        <p>CYBER COMMAND CENTER</p>
                <section class="system-header">

            <div class="system-info">

                <span class="system-label">
                    SYSTEM STATUS
                </span>

                <span class="system-state">
                    ONLINE
                </span>

            </div>

            <div class="system-version">

                <span>CORE</span>

                <span>v0.1.0</span>

            </div>

        </section>


        <section class="ai-panel">

            <div class="ai-indicator">
                AI CORE
            </div>

            <p class="ai-message">
                SYSTEM READY
            </p>

        </section>
                <section class="command-center">

            <div class="ai-orb">

                <div class="orb-ring"></div>

                <div class="orb-core"></div>

            </div>

            <div class="command-status">

                <span class="status-dot"></span>

                <span>AWAITING COMMAND</span>

            </div>

            <h2>
                How can I help?
            </h2>

            <p>
                Enter a command or use voice input.
            </p>

        </section>


        <section class="command-area">

            <label for="commandInput">
                COMMAND INPUT
            </label>

            <input
                id="commandInput"
                type="text"
                placeholder="Enter command..."
                autocomplete="off"
            >
                        <div class="command-controls">

                <button
                    id="sendButton"
                    type="button"
                >
                    SEND
                </button>

                <button
                    id="voiceButton"
                    type="button"
                >
                    VOICE
                </button>

            </div>

        </section>


        <section class="quick-actions">

            <h3>QUICK ACTIONS</h3>

            <div class="action-grid">

                <button type="button">
                    WEATHER
                </button>

                <button type="button">
                    CODE ANALYSIS
                </button>

                <button type="button">
                    SYSTEM STATUS
                </button>

                <button type="button">
                    NOTES
                </button>

            </div>

        </section>

    </main>

</body>

</html>
