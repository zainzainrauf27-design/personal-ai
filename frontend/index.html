<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal AI</title>

    <meta
        name="description"
        content="Personal AI Cyber Command Center"
    >

    <meta
        name="theme-color"
        content="#05070a"
    >
</head>

<body>

    <main id="app">

        <h1>PERSONAL AI</h1>

        <p>CYBER COMMAND CENTER</p>
                <section class="system-header">

            <div class="system-info">

                <span class="system-label">
                    SYSTEM STATUS
                </span>

                <span class="system-state">
                    ONLINE
                </span>

            </div>

            <div class="system-version">

                <span>CORE</span>

                <span>v0.1.0</span>

            </div>

        </section>


        <section class="ai-panel">

            <div class="ai-indicator">
                AI CORE
            </div>

            <p class="ai-message">
                SYSTEM READY
            </p>

        </section>

    </main>

</body>

</html>
